  .viewer{display:none;max-width:960px;margin:1rem auto;padding:0 1rem}
  .viewer.open{display:block}
  .viewer iframe{width:100%;height:80vh;border:none;background:#fff}
  .viewer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
  main{max-width:960px;margin:2rem auto;padding:0 1rem}
  .category{background:var(--card);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:1.5rem;overflow:hidden}
  .cat-header{background:var(--accent);color:#fff;padding:1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

  .cat-progress{font-size:.9rem;background:rgba(255,255,255,.2);padding:.2rem .6rem;border-radius:999px}
  .pdf-list{display:none;padding:1rem}
  .pdf-list.open{display:block}
  .pdf-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid #eee}
  .pdf-item:last-child{border:none}
  .pdf-title{color:var(--accent);text-decoration:none;font-weight:500;cursor:pointer}
  .pdf-title:hover{text-decoration:underline}
  .chk{margin-left:1rem}
  .overall{background:var(--card);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:1.5rem;text-align:center}
  .bar{height:12px;background:#e0e0e0;border-radius:6px;overflow:hidden;margin-top:.5rem}
  .bar>div{height:100%;background:var(--accent);transition:width .3s}
  .small{font-size:.9rem;color:#666}
</style>
</head>

// ---------- HELPERS ----------
const STORAGE_KEY = 'aptitudeProgress';
function loadProgress(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}} }
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)) }
function isDone(key){ return !!loadProgress()[key] }
function toggleDone(key){
  const p=loadProgress(); p[key]=!p[key]; saveProgress(p); render()
}

// ---------- VIEWER ----------
function showViewer(path, title){
  document.getElementById('viewerFrame').src = path + '#toolbar=0';
  document.getElementById('viewerTitle').textContent = title;
  document.getElementById('viewer').classList.add('open');
}
function closeViewer(){
  document.getElementById('viewerFrame').src = '';
  document.getElementById('viewer').classList.remove('open');
}

// ---------- RENDER ----------
function render(){
  const prog=loadProgress();
  const app=document.getElementById('app');
  let total=0, done=0;
  let html='';
  for(const [cat, files] of Object.entries(categories)){
    let catDone=0;
    const items = files.map(f=>{
      const key=cat+'|'+f;
      if(prog[key]) catDone++;
      total++; if(prog[key]) done++;
      const name = f.split('/').pop();
      return `<div class="pdf-item">
        <span class="pdf-title" onclick="showViewer('${f}','${name.replace(/'/g,"\\'")}')">${name}</span>
        <label><input type="checkbox" class="chk" ${prog[key]?'checked':''} onchange="toggleDone('${key}')"> Done</label>
      </div>`;
    }).join('');
    const pct = files.length? Math.round(catDone/files.length*100):0;
    html+=`<div class="category">
      <div class="cat-header" onclick="this.parentElement.querySelector('.pdf-list').classList.toggle('open')">
        <h2>${cat}</h2><span class="cat-progress">${catDone}/${files.length} (${pct}%)</span>
      </div>
      <div class="pdf-list">${items}</div>
    </div>`;
  }
  app.innerHTML=html;
  // overall
  const overallPct = total? Math.round(done/total*100):0;
  document.getElementById('overallBar').style.width = overallPct+'%';
  document.getElementById('overallText').textContent = `${done} / ${total} completed (${overallPct}%)`;
}
render();
